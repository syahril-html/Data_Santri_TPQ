<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard TPQ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>  

    <div class="dashboard-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h3>TPQ Desa</h3>
            </div>
            <nav class="sidebar-menu">
                <ul>
                    <li class="active" id="menu-santri">
                        <a href="#" onclick="bukaMenuSantri()">Data Santri</a>
                    </li>
                    <li id="menu-guru">
                        <a href="#" onclick="bukaMenuGuru()">Data Guru</a>
                    </li>
                    <li>
                        <a href="#">Data Kelas</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="top-header">
                <span class="user-info">User: admin | Tanggal: 15-04-2026</span>
            </header>

            <!-- KUMPULAN MODAL (Diletakkan di atas agar tidak merusak tabel) -->
            
            <!-- Modal Tambah Santri -->
            <div id="modalTambah" class="modal">
                <div class="modal-content" style="max-width: 800px;">
                    <h3>Tambah Data Santri Baru</h3>
                    <form id="formTambah" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                        <div>
                            <div class="form-group"><label>Nama Lengkap:</label><input type="text" id="nama" placeholder="Nama lengkap"></div>
                            <div class="form-group"><label>NIK Santri:</label><input type="text" id="nik" placeholder="16 digit NIK"></div>
                            <div class="form-group"><label>TTL:</label><input type="text" id="ttl" placeholder="Tempat, Tgl Lahir"></div>
                            <div class="form-group"><label>Kelas:</label><input type="text" id="kelas" required placeholder="Contoh: Jilid 4"></div>
                            <div class="form-group"><label>No. KK:</label><input type="text" id="no_kk" placeholder="Nomor Kartu Keluarga"></div>
                        </div>
                        <div>
                            <div class="form-group"><label>Nama Ayah:</label><input type="text" id="ayah" placeholder="Nama Ayah"></div>
                            <div class="form-group"><label>NIK Ayah:</label><input type="text" id="nik_ayah" placeholder="NIK Ayah"></div>
                            <div class="form-group"><label>Nama Ibu:</label><input type="text" id="ibu" placeholder="Nama Ibu"></div>
                            <div class="form-group"><label>NIK Ibu:</label><input type="text" id="nik_ibu" placeholder="NIK Ibu"></div>
                        </div>
                        <div style="grid-column: span 2; display: flex; justify-content: flex-end; gap: 10px;">
                            <button type="submit" class="btn-save">Simpan Data</button>
                            <button type="button" onclick="toggleTambah()" class="btn-cancel">Batal</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal Edit Santri -->
            <div id="modalEdit" class="modal">
                <div class="modal-content" style="max-width: 800px;">
                    <h3>Edit Data Santri</h3>
                    <form id="formEdit" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px;">
                        <input type="hidden" id="edit-id">
                        <div>
                            <div class="form-group"><label>Nama Lengkap:</label><input type="text" id="edit-nama" required></div>
                            <div class="form-group"><label>NIK Santri:</label><input type="text" id="edit-nik"></div>
                            <div class="form-group"><label>TTL:</label><input type="text" id="edit-ttl"></div>
                            <div class="form-group"><label>Kelas:</label><input type="text" id="edit-kelas" required></div>
                            <div class="form-group"><label>No. KK:</label><input type="text" id="edit-no_kk"></div>
                        </div>
                        <div>
                            <div class="form-group"><label>Nama Ayah:</label><input type="text" id="edit-ayah"></div>
                            <div class="form-group"><label>NIK Ayah:</label><input type="text" id="edit-nik_ayah"></div>
                            <div class="form-group"><label>Nama Ibu:</label><input type="text" id="edit-ibu"></div>
                            <div class="form-group"><label>NIK Ibu:</label><input type="text" id="edit-nik_ibu"></div>
                        </div>
                        <div style="grid-column: span 2; display: flex; justify-content: flex-end; gap: 10px;">
                            <button type="submit" class="btn-save">Update Data</button>
                            <button type="button" onclick="toggleEdit()" class="btn-cancel">Batal</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal Detail -->
            <div id="modalDetail" class="modal">
                <div class="modal-content" style="width:400px;">
                    <h3 style="border-bottom: 2px solid #eee; padding-bottom: 10px;">Detail Informasi Santri</h3>
                    <div id="isiDetail" style="line-height: 2; margin: 15px 0;"></div>
                    <button onclick="document.getElementById('modalDetail').style.display='none'" class="btn-cancel" style="width: 100%;">Tutup</button>
                </div>
            </div>

            <!-- Modal Tambah Guru -->
            <div id="modalTambahGuru" class="modal">
                <div class="modal-content" style="max-width: 500px;">
                    <h3>Tambah Data Guru Baru</h3>
                    <form id="formTambahGuru" style="margin-top: 20px;">
                        <div class="form-group">
                            <label>Nama Lengkap Guru:</label>
                            <input type="text" id="nama-guru" required placeholder="Masukkan nama lengkap">
                        </div>
                        <div class="form-group">
                            <label>NIP / No. Induk:</label>
                            <input type="text" id="nip-guru" required placeholder="Masukkan NIP">
                        </div>
                        <div class="form-group">
                            <label>Jabatan:</label>
                            <select id="jabatan-guru" required style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;">
                                <option value="">-- Pilih Jabatan --</option>
                                <option value="Kepala TPQ">Kepala TPQ</option>
                                <option value="Ustadz">Ustadz</option>
                                <option value="Ustadzah">Ustadzah</option>
                                <option value="Administrasi">Administrasi</option>
                            </select>
                        </div>
                        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                            <button type="submit" class="btn-save">Simpan Guru</button>
                            <button type="button" onclick="tutupModalGuru()" class="btn-cancel">Batal</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- AREA KONTEN (Tabel) -->
            <div class="content-body" id="konten-santri">
                <div class="header-tabel">
                    <h2>Data Siswa Santri</h2>
                    <button class="btn-add" onclick="toggleTambah()">+ Tambah Santri</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama</th>
                                <th>NIK</th>
                                <th>Kelas</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-santri">
                            <!-- Data Santri Masuk Sini -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="content-body" id="konten-guru" style="display: none;">
                <div class="header-tabel">
                    <h2>Data Guru TPQ</h2>
                    <button class="btn-add" onclick="bukaModalGuru()">+ Tambah Guru</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Guru</th>
                                <th>NIP</th>
                                <th>Jabatan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-guru-body">
                            <!-- Data Guru Masuk Sini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="guru.js"></script>
    <script src="script.js"></script> 
</body>
</html>
